name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.3
          bundler-cache: true
      - run: bundle exec rspec

  gem-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.3
          bundler-cache: true
      - run: gem build wokku-cli.gemspec
      - name: Install gem locally and smoke
        run: |
          gem install --local --user-install ./wokku-cli-*.gem
          export PATH="$(ruby -e 'puts Gem.user_dir')/bin:$PATH"
          wokku version
          wokku --help | head -5

  command-count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.3
          bundler-cache: true
      - name: Check command count matches help output
        run: |
          declared=$(grep -h '^register ' lib/wokku/commands/*.rb | wc -l | tr -d ' ')
          listed=$(ruby -Ilib exe/wokku --help | grep -E '^  [a-z]' | wc -l | tr -d ' ')
          if [ "$declared" -ne "$listed" ]; then
            echo "Command count drift: $declared registered, $listed in help"
            exit 1
          fi
          echo "Command count OK: $declared"

  openapi-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: 3.4.3
      - run: ruby script/openapi_coverage.rb --self-test
      - run: ruby script/openapi_coverage.rb https://wokku.cloud/api/v1/openapi.yaml "lib/**/*.rb" --gate
