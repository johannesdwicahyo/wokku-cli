# operationIds this client intentionally does not expose. The gate fails on any
# other uncovered operation, and on entries that no longer exist in the contract.
ignore:
  - { id: servers.create, reason: system-admin only }
  - { id: servers.destroy, reason: system-admin only }
  - { id: billing.create_checkout, reason: browser payment flow; billing:plan points at the dashboard }
  - { id: billing.portal, reason: browser payment flow }
  - { id: devices.create, reason: iOS push registration }
  - { id: devices.delete, reason: iOS push registration }
  - { id: meta.show, reason: client-internal metadata }
  - { id: auth.login, reason: password login; the CLI uses the device flow }
  - { id: tunnel_authorize.create, reason: server-to-server hook called by the tunnel server }
